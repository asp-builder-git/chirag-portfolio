name: CI

on:
  pull_request:
  push:
    branches: [chore/org-scale-roadmap, main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx astro check
      - name: Build
        run: npm run build
      - name: Dist smoke
        run: |
          set -euo pipefail
          test -d dist
          if grep -REq '/chirag-portfolioprojects|/chirag-portfolioresume|/chirag-portfolioplayground|/chirag-portfoliofonts' dist; then
            echo "FAIL: mashed BASE_URL join in dist"
            exit 1
          fi
          if grep -REq 'href="/favicon\.(svg|ico)"' dist; then
            echo "FAIL: root-absolute favicon in dist"
            exit 1
          fi
          if grep -qi 'Appearance' dist/index.html; then
            echo "FAIL: Appearance found on home index"
            exit 1
          fi
          INDEX_CSS=$(grep -oE '_astro/[^"]+\.css' dist/index.html | head -20 || true)
          for f in $INDEX_CSS; do
            if [[ -f "dist/$f" ]] && grep -Eq 'neonTokyo|bloodMoon|data-theme-persona=.matrix' "dist/$f"; then
              echo "FAIL: lab persona matrix CSS linked from home: $f"
              exit 1
            fi
          done
          echo "Dist smoke OK"
      - name: Design a11y
        run: npm run design:a11y
